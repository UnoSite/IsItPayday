name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: Test with holidays ${{ matrix.holidays-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        holidays-version: ["0.103", latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          if [ "${{ matrix.holidays-version }}" = "latest" ]; then
            pip install --upgrade holidays
          else
            pip install "holidays==${{ matrix.holidays-version }}"
          fi

      - name: Run tests
        run: pytest tests/ -v
